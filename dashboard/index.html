<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>申込ダッシュボード｜FC琉球観戦チケット付きバスツアー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F8E9;
    --ink: #221816;
    --brand: #009575;
    --brand-deep: #00745B;
    --lime-dark: #7E9800;   /* データ用（コントラスト検証済み） */
    --accent: #ED6D00;
    --muted: #6B7266;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
  }
  .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .updated { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-top: 24px;
  }
  .tile {
    background: #fff;
    border-radius: 14px;
    padding: 18px 16px;
  }
  .tile .label { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .tile .value {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 800;
    font-size: 2rem;
    line-height: 1.3;
  }
  .tile .value small { font-size: 1rem; margin-left: 2px; }
  .tile.total { background: var(--brand); }
  .tile.total .label { color: rgba(255,255,255,0.85); }
  .tile.total .value { color: #fff; }

  .breakdown {
    background: #fff;
    border-radius: 14px;
    padding: 20px 16px;
    margin-top: 14px;
  }
  .breakdown h2 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; }
  .bar {
    display: flex;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    background: #EFF3E6;
    gap: 2px; /* 2pxサーフェスギャップ */
  }
  .bar .seg-adult { background: var(--brand); }
  .bar .seg-kids { background: var(--lime-dark); }
  .legend { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
  .legend span { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend .sw-adult { background: var(--brand); }
  .legend .sw-kids { background: var(--lime-dark); }

  table {
    width: 100%;
    margin-top: 14px;
    background: #fff;
    border-radius: 14px;
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    font-size: 0.9rem;
  }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid #EFF3E6; }
  tr:last-child th, tr:last-child td { border-bottom: none; }
  td { text-align: right; font-weight: 700; }
  .empty {
    margin-top: 18px;
    color: var(--muted);
    font-size: 0.9rem;
    display: none;
  }
  .err { color: var(--accent); font-weight: 700; display: none; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>申込ダッシュボード</h1>
  <p class="sub">FC琉球 観戦チケット付きバスツアー（8/29 vs SC相模原）</p>
  <p class="updated">最終更新: <span id="updated">—</span></p>

  <div class="tiles">
    <div class="tile"><div class="label">申込組数</div><div class="value"><span id="groups">—</span><small>組</small></div></div>
    <div class="tile"><div class="label">大人</div><div class="value"><span id="adults">—</span><small>名</small></div></div>
    <div class="tile"><div class="label">高校生以下</div><div class="value"><span id="kids">—</span><small>名</small></div></div>
    <div class="tile total"><div class="label">合計人数</div><div class="value"><span id="total">—</span><small>名</small></div></div>
  </div>

  <div class="breakdown">
    <h2>内訳（大人 / 高校生以下）</h2>
    <div class="bar" role="img" aria-label="大人と高校生以下の人数比">
      <div class="seg-adult" id="segAdult" style="width:50%"></div>
      <div class="seg-kids" id="segKids" style="width:50%"></div>
    </div>
    <div class="legend">
      <span><i class="sw-adult"></i>大人 <b id="adultsL">—</b>名</span>
      <span><i class="sw-kids"></i>高校生以下 <b id="kidsL">—</b>名</span>
    </div>
  </div>

  <table>
    <tr><th>申込組数</th><td id="tGroups">—</td></tr>
    <tr><th>大人（3,000円）</th><td id="tAdults">—</td></tr>
    <tr><th>高校生以下（無料）</th><td id="tKids">—</td></tr>
    <tr><th>合計人数</th><td id="tTotal">—</td></tr>
    <tr><th>参加費見込み</th><td id="tRevenue">—</td></tr>
  </table>

  <p class="empty" id="empty">まだ申し込みはありません。</p>
  <p class="err" id="err">データの読み込みに失敗しました。時間をおいて再読み込みしてください。</p>
</div>

<script>
(async () => {
  const $ = id => document.getElementById(id);
  // GASウェブアプリのデプロイURL（/exec）。未設定の間は静的data.jsonにフォールバック
  const API_URL = '';
  try {
    const res = await fetch(API_URL || './data.json?t=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    const yen = n => n.toLocaleString('ja-JP') + '円';
    $('groups').textContent = d.groups;
    $('adults').textContent = d.adults;
    $('kids').textContent = d.kids;
    $('total').textContent = d.total;
    $('adultsL').textContent = d.adults;
    $('kidsL').textContent = d.kids;
    $('tGroups').textContent = d.groups + '組';
    $('tAdults').textContent = d.adults + '名';
    $('tKids').textContent = d.kids + '名';
    $('tTotal').textContent = d.total + '名';
    $('tRevenue').textContent = yen(d.revenue);
    $('updated').textContent = d.updated_at;
    if (d.total > 0) {
      $('segAdult').style.width = (d.adults / d.total * 100) + '%';
      $('segKids').style.width = (d.kids / d.total * 100) + '%';
    } else {
      $('segAdult').style.width = '0%';
      $('segKids').style.width = '0%';
      $('empty').style.display = 'block';
    }
  } catch (e) {
    $('err').style.display = 'block';
  }
})();
</script>
</body>
</html>
